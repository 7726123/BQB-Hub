<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#5a6170" stroke-linecap="round" stroke-linejoin="round">
  <!-- 主描线：带手绘晃动，端点略微出头 -->
  <g stroke-width="1.3">
    <!-- 桶提手 -->
    <path d="M10.1 5.75 C10.15 4.5 10.7 3.95 12.05 3.98 C13.35 4.01 13.85 4.55 13.9 5.65"/>
    <!-- 盖沿横杆（左右出头） -->
    <path d="M4.35 6.5 C8.2 5.95 12.4 5.85 16.1 5.95 C17.4 5.99 18.7 6.1 19.7 5.9"/>
    <!-- 上沿口 -->
    <path d="M5.75 8.95 C9.6 8.5 14.1 8.4 18.45 8.6"/>
    <!-- 左桶壁（微斜内收） -->
    <path d="M6 9.1 C6.35 12.4 6.75 16.3 7.3 19.9"/>
    <!-- 右桶壁 -->
    <path d="M18.2 8.85 C17.85 12.3 17.45 16.2 16.9 19.85"/>
    <!-- 桶底（左右出头） -->
    <path d="M6.9 20.15 C10.2 20.5 13.9 20.45 17.25 20.05"/>
    <!-- 两条竖镂空（微微歪斜） -->
    <path d="M10.35 11.2 C10.45 13.5 10.5 15.7 10.42 17.5"/>
    <path d="M13.7 11.1 C13.62 13.4 13.55 15.6 13.62 17.4"/>
  </g>
  <!-- 右侧排线阴影 + 左壁一道淡排线 -->
  <g stroke-width="0.7" opacity=".35">
    <path d="M15.9 11.6 L15.15 13.5"/>
    <path d="M16.1 13.9 L15.35 15.8"/>
    <path d="M16.35 16.2 L15.7 17.9"/>
    <path d="M8.4 11.1 L7.9 12.6"/>
  </g>
  <!-- 复描：整体轻移+微旋，低透明度，模拟铅笔重描 -->
  <g stroke-width="0.8" opacity=".45" transform="translate(.45 .3) rotate(.8 12 12)">
    <path d="M4.6 6.7 C8.5 6.15 12.6 6.05 16.3 6.15 C17.5 6.18 18.6 6.28 19.5 6.1"/>
    <path d="M5.95 9.25 C9.7 8.8 14 8.7 18.25 8.9"/>
    <path d="M6.25 9.5 C6.6 12.7 7 16.4 7.5 19.75"/>
    <path d="M17.95 9.1 C17.6 12.5 17.25 16.1 16.75 19.65"/>
    <path d="M10.6 11.45 C10.7 13.6 10.72 15.6 10.66 17.3"/>
    <path d="M13.45 11.35 C13.4 13.5 13.35 15.5 13.4 17.25"/>
  </g>
  <!-- 地面淡淡一笔 -->
  <path d="M8.2 21.6 C10.3 21.9 13.2 21.85 15.9 21.5" stroke-width="0.7" opacity=".3"/>
</svg>
